<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saku bussiajad</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#171717}.app{max-width:480px;margin:auto;padding:32px 18px}h1{font-size:30px;margin:10px 0 8px}h2{font-size:18px;margin:0 0 14px}.now{color:#6d6d6d;margin-bottom:26px}.choices{display:grid;gap:12px}.choice,.back{border:0;border-radius:16px;padding:20px 16px;font-size:18px;font-weight:700;color:white;cursor:pointer;text-align:left}.green{background:#174f3a}.blue{background:#183c68}.gray{background:#60656a}.result{display:none}.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}.back{background:#e7e7e4;color:#222;padding:10px 14px}.card{border-radius:18px;background:white;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0000000c}.bad{background:#fff1e8;border:2px solid #d76a22}.line{display:flex;align-items:center;justify-content:space-between;gap:12px}.time{font-size:27px;font-weight:800}.bus{padding:7px 11px;border-radius:10px;color:white;font-weight:800;background:#3167a3}.meta{margin-top:9px;font-size:16px}.warn{font-weight:800;color:#a64200;margin-top:8px}.status{padding:18px;background:white;border-radius:16px;margin-top:14px}.small{font-size:13px;color:#777;margin-top:18px;text-align:center}</style></head><body><main class="app">
<section id="pick"><h1>Kuidas koju saan?</h1><div id="now" class="now"></div><h2>Olen siin:</h2><div class="choices">
<button class="choice green" onclick="show('Alg-/Muusikakool')">Alg-/Muusikakool</button>
<button class="choice blue" onclick="show('Põhikool')">Põhikool</button>
<button class="choice gray" onclick="show('Gümnaasium / Huvikeskus')">Gümnaasium / Huvikeskus</button>
</div></section>
<section id="result" class="result"><div class="top"><button class="back" onclick="back()">←</button><h2 id="where"></h2></div><div id="resultNow" class="now"></div><div id="cards" class="status">Otsin 5 järgmist varianti…</div><div class="small">Ajad tulevad Peatus.ee reisiplaneerijast.</div></section>
</main><script>
const API='https://api.peatus.ee/routing/v1/routers/estonia/index/graphql';
const places={
 'Alg-/Muusikakool':'Saku algkool',
 'Põhikool':'Saku põhikool',
 'Gümnaasium / Huvikeskus':'Saku keskuse'
};
const destinations=['Karjavärava tee','Murumäe'];
const fmtDate=d=>new Intl.DateTimeFormat('et-EE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d);
function clock(){const s='Praegu: '+fmtDate(new Date());document.getElementById('now').textContent=s;document.getElementById('resultNow').textContent=s}
clock();setInterval(clock,30000);
async function gql(query,variables){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query,variables})});if(!r.ok)throw new Error('Peatus.ee '+r.status);const j=await r.json();if(j.errors)throw new Error(j.errors[0].message);return j.data}
async function stop(name){const d=await gql('query($name:String!){stops(name:$name){name lat lon}}',{name});const exact=d.stops.find(x=>x.name.toLowerCase()===name.toLowerCase())||d.stops[0];if(!exact)throw new Error('Peatust ei leitud: '+name);return exact}
async function plan(from,to){const now=new Date(),date=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-'),time=[String(now.getHours()).padStart(2,'0'),String(now.getMinutes()).padStart(2,'0'),'00'].join(':');
const q='query($fl:Float!,$fn:Float!,$tl:Float!,$tn:Float!,$date:String,$time:String){plan(from:{lat:$fl,lon:$fn},to:{lat:$tl,lon:$tn},date:$date,time:$time,numItineraries:5,arriveBy:false,maxWalkDistance:1200,transferPenalty:600){itineraries{startTime endTime duration legs{mode startTime endTime from{name} to{name} route{shortName}}}}}';
const d=await gql(q,{fl:from.lat,fn:from.lon,tl:to.lat,tn:to.lon,date,time});return d.plan.itineraries||[]}
function hh(ms){return new Date(Number(ms)).toLocaleTimeString('et-EE',{hour:'2-digit',minute:'2-digit'})}
function make(it,dest){const transit=it.legs.filter(l=>l.mode!=='WALK');const buses=transit.map(l=>l.route&&l.route.shortName).filter(Boolean);const first=transit[0]||it.legs[0];const dep=first?first.startTime:it.startTime;const mins=Math.round(it.duration/60);const bad=dest==='Murumäe';return {dep:Number(dep),arr:Number(it.endTime),mins,bus:buses.join(' → ')||'jalgsi',dest,bad}}
async function show(label){document.getElementById('pick').style.display='none';document.getElementById('result').style.display='block';document.getElementById('where').textContent='Olen: '+label;document.getElementById('cards').className='status';document.getElementById('cards').textContent='Otsin 5 järgmist varianti…';clock();
try{const [from,k,m]=await Promise.all([stop(places[label]),stop('Karjavärava tee'),stop('Murumäe')]);const [a,b]=await Promise.all([plan(from,k),plan(from,m)]);let rows=[...a.map(x=>make(x,'Karjavärava tee')),...b.map(x=>make(x,'Murumäe'))];const seen=new Set();rows=rows.sort((x,y)=>x.arr-y.arr).filter(x=>{const key=x.dep+'|'+x.arr+'|'+x.bus+'|'+x.dest;if(seen.has(key))return false;seen.add(key);return true}).slice(0,5);if(!rows.length)throw new Error('Sobivaid sõite ei leitud');
document.getElementById('cards').className='';document.getElementById('cards').innerHTML=rows.map(x=>'<div class="card '+(x.bad?'bad':'')+'"><div class="line"><span class="time">'+hh(x.dep)+'</span><span class="bus">'+x.bus+'</span></div><div class="meta">Kohal <b>'+hh(x.arr)+'</b> · <b>'+x.mins+' min</b></div>'+(x.bad?'<div class="warn">⚠️ Murumäe</div>':'')+'</div>').join('');
}catch(e){document.getElementById('cards').className='status';document.getElementById('cards').innerHTML='<b>Päris aegu ei õnnestunud praegu laadida.</b><br><span style="font-size:14px;color:#666">Proovi hetke pärast uuesti. ('+String(e.message).replace(/[<>]/g,'')+')</span>'}}
function back(){document.getElementById('result').style.display='none';document.getElementById('pick').style.display='block';clock()}
</script></body></html>
