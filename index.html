<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buss koju</title><style>
*{box-sizing:border-box}body{margin:0;background:#fafaf8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#111827}.app{max-width:480px;margin:auto;padding:24px 18px}h1{font-size:31px;margin:0 0 6px}.now{color:#687386;font-size:14px;margin-bottom:22px}.choices{display:grid;gap:12px}.choice,.back{border:0;border-radius:18px;padding:20px;font-size:19px;font-weight:800;color:white;text-align:left}.green{background:#185d43}.blue{background:#214a7d}.gray{background:#6a6e72}.result{display:none}.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}.back{background:#e9e9e6;color:#222;padding:9px 13px}.where{font-size:22px;font-weight:800}.card{border-radius:20px;padding:18px 16px;margin:13px 0;border:1px solid}.good{background:#ecfbf0;border-color:#bceaca}.bad{background:#fff0f0;border-color:#ffbaba}.alt{background:#eef6ff;border-color:#b8d7ff}.main{display:flex;align-items:center;gap:10px}.time{font-size:35px;font-weight:900;letter-spacing:-1px;white-space:nowrap}.board{font-size:19px;font-weight:900;line-height:1.1;flex:1}.bus{background:#1671c9;color:white;font-size:17px;font-weight:900;border-radius:12px;padding:8px 10px;white-space:nowrap}.dest{font-size:12px;margin-top:9px;color:#6b7280}.dest b{font-size:13px}.good .dest b{color:#087443}.bad .dest b{color:#d62d2d}.alt .dest b{color:#1769aa}.status{background:white;border-radius:16px;padding:18px;margin-top:14px;color:#555}.sub{font-size:15px;color:#697386;margin:0 0 16px}</style></head><body><main class="app">
<section id="pick"><h1>Buss koju</h1><div id="now" class="now"></div><h2 style="font-size:19px">Olen siin:</h2><div class="choices">
<button class="choice green" onclick="show('Alg-/Muusikakool')">Alg-/Muusikakool</button>
<button class="choice blue" onclick="show('Põhikool')">Põhikool</button>
<button class="choice gray" onclick="show('Gümnaasium / Huvikeskus')">Gümnaasium / Huvikeskus</button>
</div></section>
<section id="result" class="result"><div class="top"><button class="back" onclick="back()">←</button><div id="where" class="where"></div></div><div id="resultNow" class="now"></div><div class="sub">5 järgmist bussi koju</div><div id="cards" class="status">Otsin järgmisi busse…</div></section>
</main><script>
const API='https://api.peatus.ee/routing/v1/routers/estonia/index/graphql';
/* Iga kooli juures otsime mitmest lähedasest päris peatusest; tulemused pannakse väljumisaja järgi kokku. */
const origins={
 'Alg-/Muusikakool':['Saku algkool','Saku Raudteejaam','Õlletehase','Saku keskuse'],
 'Põhikool':['Saku põhikool','Pähklimäe','Salu','Saku keskuse'],
 'Gümnaasium / Huvikeskus':['Saku keskuse','Salu','Saku Raudteejaam','Saku algkool']
};
const destinations=['Karjavärava tee','Murumäe','Murimäe'];
const fmt=d=>new Intl.DateTimeFormat('et-EE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d);
function clock(){let s='Praegu: '+fmt(new Date());now.textContent=s;resultNow.textContent=s}clock();setInterval(clock,30000);
async function gql(q,v){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q,variables:v})});if(!r.ok)throw Error('Peatus.ee '+r.status);let j=await r.json();if(j.errors)throw Error(j.errors[0].message);return j.data}
async function stop(name){let d=await gql('query($name:String!){stops(name:$name){name lat lon}}',{name});let s=d.stops.find(x=>x.name.toLowerCase()===name.toLowerCase())||d.stops[0];if(!s)throw Error('Peatust ei leitud');return s}
async function plan(a,b){let n=new Date(),date=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'),time=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':00';
let q='query($a:Float!,$b:Float!,$c:Float!,$d:Float!,$date:String,$time:String){plan(from:{lat:$a,lon:$b},to:{lat:$c,lon:$d},date:$date,time:$time,numItineraries:4,arriveBy:false,maxWalkDistance:350,transferPenalty:900){itineraries{startTime endTime duration legs{mode startTime endTime from{name} to{name} route{shortName}}}}}';
let d=await gql(q,{a:a.lat,b:a.lon,c:b.lat,d:b.lon,date,time});return d.plan.itineraries||[]}
function hh(x){return new Date(Number(x)).toLocaleTimeString('et-EE',{hour:'2-digit',minute:'2-digit'})}
function row(it,dest){let t=it.legs.filter(x=>x.mode!=='WALK');if(!t.length)return null;let first=t[0],last=t[t.length-1],bus=t.map(x=>x.route?.shortName).filter(Boolean).join(' → ');return {dep:+first.startTime,board:first.from.name,bus,dest,bad:dest==='Murumäe',alt:dest==='Murimäe',arr:+it.endTime}}
async function show(label){pick.style.display='none';result.style.display='block';where.textContent=label;cards.className='status';cards.textContent='Otsin järgmisi busse…';clock();
try{let names=origins[label], allStops=await Promise.all([...names,...destinations].map(stop)), os=allStops.slice(0,names.length),ds=allStops.slice(names.length);let jobs=[];for(let o of os)for(let i=0;i<ds.length;i++)jobs.push(plan(o,ds[i]).then(a=>a.map(x=>row(x,destinations[i]))));let all=(await Promise.all(jobs)).flat().filter(Boolean);let seen=new Set();all=all.sort((a,b)=>a.arr-b.arr).filter(x=>{let k=x.dep+'|'+x.board+'|'+x.bus+'|'+x.dest;if(seen.has(k))return false;seen.add(k);return true});all=all.slice(0,5);if(!all.length)throw Error('Sobivaid sõite ei leitud');
cards.className='';cards.innerHTML=all.map(x=>'<div class="card '+(x.bad?'bad':(x.alt?'alt':'good'))+'"><div class="main"><div class="time">'+hh(x.dep)+'</div><div class="board">'+x.board+'</div><div class="bus">'+x.bus+'</div></div><div class="dest">Maha: <b>'+x.dest+'</b> · kohal <b>'+hh(x.arr)+'</b></div></div>').join('');
}catch(e){cards.className='status';cards.innerHTML='<b>Päris aegu ei õnnestunud laadida.</b><br><small>Proovi hetke pärast uuesti.</small>'}}
function back(){result.style.display='none';pick.style.display='block';clock()}
</script></body></html>
